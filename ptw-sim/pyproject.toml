[project]
name = "ptw-sim"
version = "0.1.0"
description = "ARM v9 2-stage page table walk simulator with full walk trace serialization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPLv3" }
authors = [{ name = "Hemin Desai" }]

dependencies = [
    "pydantic>=2.0.0", # Data validation and models
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ptw-sim = "ptw_sim.cli:main"
ptw-gen = "ptw_sim.scenariogen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptw_sim"]
